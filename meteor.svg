<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="860" height="160">
  <rect width="860" height="160" fill="#0d1117"/>

  <!-- stars -->
  <circle cx="42" cy="18" r="1" fill="#e6edf3" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="130" cy="40" r="1.2" fill="#e6edf3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="220" cy="12" r="0.8" fill="#e6edf3" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="310" cy="35" r="1" fill="#e6edf3" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="8" r="1.3" fill="#e6edf3" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="490" cy="28" r="0.9" fill="#e6edf3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="580" cy="15" r="1.1" fill="#e6edf3" opacity="0.7"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="670" cy="42" r="0.8" fill="#e6edf3" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="20" r="1" fill="#e6edf3" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="38" r="1.2" fill="#e6edf3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="75" cy="55" r="0.7" fill="#e6edf3" opacity="0.3"><animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="70" r="1" fill="#e6edf3" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="62" r="0.8" fill="#e6edf3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="50" r="1.1" fill="#e6edf3" opacity="0.3"><animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="65" r="0.9" fill="#e6edf3" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.3s" repeatCount="indefinite"/></circle>

  <!-- METEOR 1 — green, starts top-left, hits mid -->
  <g>
    <line x1="0" y1="0" x2="0" y2="0" stroke="url(#g1)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="-60;180" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="-20;100" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;220" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;120" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.4s" begin="0s" repeatCount="indefinite"/>
    </line>
    <!-- impact flash -->
    <circle cx="0" cy="0" r="0" fill="#39d353" opacity="0">
      <animate attributeName="cx" values="220" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="0;0;0;8;0" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;0.9;0" dur="1.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- METEOR 2 — blue, starts top-right -->
  <g>
    <line x1="0" y1="0" x2="0" y2="0" stroke="url(#g2)" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="x1" values="960;640" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="-20;90" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="900;600" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;110" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="0" fill="#58a6ff" opacity="0">
      <animate attributeName="cx" values="600" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="0;0;0;7;0" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;0.9;0" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- METEOR 3 — white, fast -->
  <g>
    <line x1="0" y1="0" x2="0" y2="0" stroke="url(#g3)" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="x1" values="300;520" dur="1.1s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="-30;80" dur="1.1s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="360;560" dur="1.1s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-10;100" dur="1.1s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="2s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="0" fill="#ffffff" opacity="0">
      <animate attributeName="cx" values="560" dur="1.1s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100" dur="1.1s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="0;0;0;5;0" dur="1.1s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;0.8;0" dur="1.1s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- METEOR 4 — green, delayed -->
  <g>
    <line x1="0" y1="0" x2="0" y2="0" stroke="url(#g1)" stroke-width="2.2" stroke-linecap="round">
      <animate attributeName="x1" values="600;820" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="-20;110" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="650;860" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;130" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="0" fill="#39d353" opacity="0">
      <animate attributeName="cx" values="860" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="130" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="0;0;0;9;0" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;1;0" dur="1.5s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- METEOR 5 — blue, top-center -->
  <g>
    <line x1="0" y1="0" x2="0" y2="0" stroke="url(#g2)" stroke-width="1.6" stroke-linecap="round">
      <animate attributeName="x1" values="380;560" dur="1.3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="-25;75" dur="1.3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="430;600" dur="1.3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-5;95" dur="1.3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.3s" begin="1.6s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="0" fill="#58a6ff" opacity="0">
      <animate attributeName="cx" values="600" dur="1.3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="95" dur="1.3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="0;0;0;6;0" dur="1.3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;0.9;0" dur="1.3s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- METEOR 6 — slow dramatic green -->
  <g>
    <line x1="0" y1="0" x2="0" y2="0" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="x1" values="100;380" dur="1.8s" begin="4.8s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="-40;120" dur="1.8s" begin="4.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="180;440" dur="1.8s" begin="4.8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-10;150" dur="1.8s" begin="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.8s" begin="4.8s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="0" r="0" fill="#39d353" opacity="0">
      <animate attributeName="cx" values="440" dur="1.8s" begin="4.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150" dur="1.8s" begin="4.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="0;0;0;11;0" dur="1.8s" begin="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;1;0" dur="1.8s" begin="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- gradients -->
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
