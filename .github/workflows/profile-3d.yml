name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Vinyas1
        with:
          SETTING_JSON: |
            {
              "githubUserName": "Vinyas1",
              "type": "isometric",
              "backgroundColor": "#0d1117",
              "strongColor": "#39d353",
              "mediumColor": "#26a641",
              "lightColor": "#006d32",
              "emptyColor": "#161b22",
              "dotColor": "#39d353",
              "skyColor": "#0d1117",
              "isAnimated": true,
              "outputDir": "profile-3d-contrib"
            }

      - name: Inject solid dark background into SVG
        run: |
          python3 - <<'EOF'
import glob, re

for path in glob.glob("profile-3d-contrib/*.svg"):
    with open(path, "r", encoding="utf-8") as f:
        svg = f.read()

    # inject a solid bg rect right after the opening <svg ...> tag
    svg = re.sub(
        r'(<svg\b[^>]*>)',
        r'\1<rect width="100%" height="100%" fill="#0d1117"/>',
        svg, count=1
    )

    with open(path, "w", encoding="utf-8") as f:
        f.write(svg)
    print(f"Patched: {path}")
EOF

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update 3D graph [skip ci]"
          git push
