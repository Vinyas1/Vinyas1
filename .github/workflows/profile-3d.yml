name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Vinyas1
        with:
          SETTING_JSON: |
            {
              "githubUserName": "Vinyas1",
              "type": "isometric",
              "backgroundColor": "#0d1117",
              "strongColor": "#39d353",
              "mediumColor": "#26a641",
              "lightColor": "#006d32",
              "emptyColor": "#161b22",
              "dotColor": "#39d353",
              "skyColor": "#0d1117",
              "isAnimated": true,
              "outputDir": "profile-3d-contrib"
            }

      - name: Patch all light colors to dark
        run: |
          python3 - <<'EOF'
import glob, re

# Light colors the action outputs for empty cells / floor / bg
REPLACEMENTS = {
    "#ebedf0": "#161b22",  # empty cell top
    "#d1d9e0": "#21262d",  # empty cell left face
    "#c8d1d9": "#1c2128",  # empty cell right face
    "#ffffff": "#0d1117",  # background
    "#fff":    "#0d1117",
    "white":   "#0d1117",
    "#f6f8fa": "#0d1117",  # github light bg
    "#24292e": "#c9d1d9",  # keep dark text visible — skip
}

for path in glob.glob("profile-3d-contrib/*.svg"):
    with open(path, "r", encoding="utf-8") as f:
        svg = f.read()

    # Replace empty cell colors (floor tiles)
    svg = svg.replace("#ebedf0", "#161b22")
    svg = svg.replace("#d1d9e0", "#21262d")
    svg = svg.replace("#c8d1d9", "#1c2128")
    svg = svg.replace("#f0f0f0", "#161b22")
    svg = svg.replace("#e0e0e0", "#21262d")

    # Replace white backgrounds — only as fill/style values, not inside text
    svg = re.sub(r'(fill\s*=\s*["\'])#(?:fff|ffffff)(["\'])', r'\g<1>#0d1117\g<2>', svg, flags=re.IGNORECASE)
    svg = re.sub(r'(fill\s*=\s*["\'])white(["\'])', r'\g<1>#0d1117\g<2>', svg, flags=re.IGNORECASE)
    svg = re.sub(r'(background(?:-color)?\s*:\s*)#(?:fff|ffffff)\b', r'\g<1>#0d1117', svg, flags=re.IGNORECASE)
    svg = re.sub(r'(background(?:-color)?\s*:\s*)white\b', r'\g<1>#0d1117', svg, flags=re.IGNORECASE)
    svg = svg.replace("#f6f8fa", "#0d1117")

    with open(path, "w", encoding="utf-8") as f:
        f.write(svg)
    print(f"Patched: {path}")
EOF

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update 3D graph [skip ci]"
          git push
