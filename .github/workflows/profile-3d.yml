name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Vinyas1
        with:
          SETTING_JSON: |
            {
              "githubUserName": "Vinyas1",
              "type": "isometric",
              "backgroundColor": "#0d1117",
              "strongColor": "#39d353",
              "mediumColor": "#26a641",
              "lightColor": "#006d32",
              "emptyColor": "#161b22",
              "dotColor": "#39d353",
              "skyColor": "#0d1117",
              "isAnimated": true,
              "outputDir": "profile-3d-contrib"
            }

      - name: Force dark background on SVG
        run: |
          for f in profile-3d-contrib/*.svg; do
            # replace any white or light background rect with dark
            sed -i 's/fill="#ffffff"/fill="#0d1117"/gi' "$f"
            sed -i 's/fill="#fff"/fill="#0d1117"/gi' "$f"
            sed -i 's/fill="white"/fill="#0d1117"/gi' "$f"
            sed -i 's/background:#ffffff/background:#0d1117/gi' "$f"
            sed -i 's/background:#fff/background:#0d1117/gi' "$f"
            sed -i 's/background: #ffffff/background: #0d1117/gi' "$f"
            sed -i 's/background: white/background: #0d1117/gi' "$f"
            # also patch any style block color tokens
            sed -i 's/#f6f8fa/#0d1117/gi' "$f"
            sed -i 's/#ffffff/#0d1117/gi' "$f"
          done

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update 3D graph [skip ci]"
          git push
