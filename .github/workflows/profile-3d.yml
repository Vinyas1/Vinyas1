name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Vinyas1
        with:
          SETTING_JSON: |
            {
              "githubUserName": "Vinyas1",
              "type": "isometric",
              "backgroundColor": "#0d1117",
              "strongColor": "#39d353",
              "mediumColor": "#26a641",
              "lightColor": "#006d32",
              "emptyColor": "#1c2128",
              "dotColor": "#39d353",
              "skyColor": "#0d1117",
              "isAnimated": true,
              "outputDir": "profile-3d-contrib"
            }

      - name: Force dark theme on SVG
        run: |
          python3 << 'EOF'
          import glob

          for path in glob.glob("profile-3d-contrib/*.svg"):
              with open(path, "r") as f:
                  svg = f.read()

              # floor tiles
              svg = svg.replace("#ebedf0", "#1c2128")
              svg = svg.replace("#d1d9e0", "#161b22")
              svg = svg.replace("#c8d1d9", "#0d1117")
              svg = svg.replace("#f0f0f0", "#1c2128")
              svg = svg.replace("#e8e8e8", "#1c2128")
              svg = svg.replace("#d0d7de", "#161b22")
              svg = svg.replace("#f6f8fa", "#0d1117")
              svg = svg.replace("#00000f", "#1c2128")
              # background
              svg = svg.replace('"#ffffff"', '"#0d1117"')
              svg = svg.replace('"#fff"',    '"#0d1117"')
              # text — make white
              svg = svg.replace('"#444444"', '"#e6edf3"')
              svg = svg.replace('"#444"',    '"#e6edf3"')
              svg = svg.replace('"#111133"', '"#e6edf3"')
              svg = svg.replace('"#24292e"', '"#e6edf3"')
              svg = svg.replace('"#000000"', '"#e6edf3"')
              svg = svg.replace('"#333"',    '"#e6edf3"')
              svg = svg.replace('"#333333"', '"#e6edf3"')
              svg = svg.replace('"black"',   '"#e6edf3"')

              with open(path, "w") as f:
                  f.write(svg)
              print(f"Patched: {path}")
          EOF

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update 3D graph [skip ci]"
          git push
