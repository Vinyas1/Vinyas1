name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Vinyas1
        with:
          SETTING_JSON: |
            {
              "githubUserName": "Vinyas1",
              "type": "isometric",
              "backgroundColor": "#0d1117",
              "strongColor": "#39d353",
              "mediumColor": "#26a641",
              "lightColor": "#006d32",
              "emptyColor": "#1c2128",
              "dotColor": "#39d353",
              "skyColor": "#0d1117",
              "isAnimated": true,
              "outputDir": "profile-3d-contrib"
            }

      - name: Show what colors are in the SVG
        run: |
          grep -oP '#[0-9a-fA-F]{6}' profile-3d-contrib/profile-green-animate.svg | sort | uniq -c | sort -rn | head -30

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update 3D graph [skip ci]"
          git push
