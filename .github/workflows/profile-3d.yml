name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Vinyas1
        with:
          SETTING_JSON: |
            {
              "githubUserName": "Vinyas1",
              "type": "isometric",
              "backgroundColor": "#0d1117",
              "strongColor": "#39d353",
              "mediumColor": "#26a641",
              "lightColor": "#006d32",
              "emptyColor": "#1c2128",
              "dotColor": "#39d353",
              "skyColor": "#0d1117",
              "isAnimated": true,
              "outputDir": "profile-3d-contrib"
            }

      - name: Force dark theme on SVG
        run: |
          python3 << 'EOF'
          import glob, re

          for path in glob.glob("profile-3d-contrib/*.svg"):
              with open(path, "r") as f:
                  svg = f.read()

              # floor tiles use rgb() format — patch these
              svg = svg.replace('fill="rgb(239, 239, 239)"', 'fill="#1c2128"')
              svg = svg.replace('fill="rgb(200, 200, 200)"', 'fill="#161b22"')
              svg = svg.replace('fill="rgb(167, 167, 167)"', 'fill="#0d1117"')

              # also catch any remaining light rgb values broadly
              def darken_rgb(m):
                  r, g, b = int(m.group(1)), int(m.group(2)), int(m.group(3))
                  # if grey-ish and bright, darken it
                  if r > 100 and g > 100 and b > 100 and abs(r-g) < 30 and abs(g-b) < 30:
                      return 'fill="#1c2128"'
                  return m.group(0)

              svg = re.sub(r'fill="rgb\((\d+),\s*(\d+),\s*(\d+)\)"', darken_rgb, svg)

              # text colors
              svg = svg.replace('"#444444"', '"#e6edf3"')
              svg = svg.replace('"#444"',    '"#e6edf3"')
              svg = svg.replace('"#111133"', '"#e6edf3"')
              svg = svg.replace('"#24292e"', '"#e6edf3"')
              svg = svg.replace('"#000000"', '"#e6edf3"')
              svg = svg.replace('"#333333"', '"#e6edf3"')
              svg = svg.replace('"black"',   '"#e6edf3"')

              with open(path, "w") as f:
                  f.write(svg)
              print(f"Patched: {path}")
          EOF

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update 3D graph [skip ci]"
          git push
