name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Vinyas1
        with:
          SETTING_JSON: |
            {
              "githubUserName": "Vinyas1",
              "type": "isometric",
              "backgroundColor": "#0d1117",
              "strongColor": "#39d353",
              "mediumColor": "#26a641",
              "lightColor": "#006d32",
              "emptyColor": "#161b22",
              "dotColor": "#39d353",
              "skyColor": "#0d1117",
              "isAnimated": true,
              "outputDir": "profile-3d-contrib"
            }

      - name: Fix background only — keep text visible
        run: |
          for f in profile-3d-contrib/*.svg; do
            # only replace background rect fills, not text colors
            # target the first large rect which is the bg
            python3 - <<'EOF'
import re, sys, glob

for path in glob.glob("profile-3d-contrib/*.svg"):
    with open(path, "r", encoding="utf-8") as fh:
        svg = fh.read()

    # Replace only rect elements that have white/light fill (background rects)
    # Match <rect ... fill="#ffffff" or fill="white" with large width/height
    svg = re.sub(
        r'(<rect\b[^>]*\b(?:width|height)\s*=\s*"(?:100%|[89]\d\d\d|[1-9]\d{3,})"[^>]*\bfill\s*=\s*")(?:#ffffff|#fff|white)(")',
        r'\g<1>#0d1117\g<2>',
        svg, flags=re.IGNORECASE
    )
    svg = re.sub(
        r'(<rect\b[^>]*\bfill\s*=\s*")(?:#ffffff|#fff|white)("[^>]*\b(?:width|height)\s*=\s*"(?:100%|[89]\d\d\d|[1-9]\d{3,})")',
        r'\g<1>#0d1117\g<2>',
        svg, flags=re.IGNORECASE
    )
    # Also patch style="background:..." on root svg element
    svg = re.sub(
        r'(background\s*:\s*)(?:#ffffff|#fff|white)',
        r'\g<1>#0d1117',
        svg, flags=re.IGNORECASE
    )
    # Patch fill on the root <svg> element itself if it has a white fill
    svg = re.sub(
        r'(<svg\b[^>]*\bfill\s*=\s*")(?:#ffffff|#fff|white)(")',
        r'\g<1>#0d1117\g<2>',
        svg, flags=re.IGNORECASE
    )

    with open(path, "w", encoding="utf-8") as fh:
        fh.write(svg)
    print(f"Patched: {path}")
EOF
          done

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: update 3D graph [skip ci]"
          git push
